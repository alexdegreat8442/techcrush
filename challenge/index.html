<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Inquiry Form</title>
  <!-- <link rel="stylesheet" href="style.css" /> -->

  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      background: linear-gradient(180deg, #0b1a30, #050c18);
      color: #222;
      font-family: Arial, sans-serif;
    }
    
    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }
    
    form {
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 30px;
    }
    
    .intro {
      margin-top: 0;
      margin-bottom: 28px;
      color: #666;
    }
    
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 600;
    }
    
    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cfd4da;
      border-radius: 7px;
      font: inherit;
      background: #fff;
    }
    
    textarea {
      resize: vertical;
    }
    
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    
    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-weight: normal;
      line-height: 1.4;
    }
    
    .consent input {
      width: auto;
      margin-top: 3px;
    }
    
    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    #message {
      display: none;
      margin-bottom: 0;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    
    #message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
    }
    
    #message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <main class="container">
    <form id="leadForm">
      <h1>Customer Inquiry Form</h1>
      <p class="intro">Tell us how we can help your business.</p>

      <label for="full_name">Full name *</label>
      <input id="full_name" name="full_name" type="text" required />

      <label for="email">Business email address *</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone number *</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="company_name">Company / business name *</label>
      <input id="company_name" name="company_name" type="text" required />

      <label for="service_interest">Which service are you interested in? *</label>
      <select id="service_interest" name="service_interest" required>
        <option value="">Select a service</option>
        <option value="AI automation">AI automation</option>
        <option value="Website development">Website development</option>
        <option value="CRM automation">CRM automation</option>
        <option value="Chatbot">Chatbot</option>
        <option value="Other">Other</option>
      </select>

      <label for="estimated_budget">Estimated budget *</label>
      <select id="estimated_budget" name="estimated_budget" required>
        <option value="">Select your budget</option>
        <option value="Below ₦100,000">Below ₦100,000</option>
        <option value="₦100,000 – ₦300,000">₦100,000 – ₦300,000</option>
        <option value="₦300,000 – ₦1,000,000">₦300,000 – ₦1,000,000</option>
        <option value="Above ₦1,000,000">Above ₦1,000,000</option>
        <option value="I am not sure yet">I am not sure yet</option>
      </select>

      <label for="start_timeline">When would you like to start? *</label>
      <select id="start_timeline" name="start_timeline" required>
        <option value="">Select a timeline</option>
        <option value="Immediately">Immediately</option>
        <option value="Within 1 week">Within 1 week</option>
        <option value="Within 1 month">Within 1 month</option>
        <option value="Later">Later</option>
      </select>
      
      <label for="inquiry_message">Tell us what you need help with *</label>
      <textarea
        id="inquiry_message"
        name="inquiry_message"
        rows="6"
        required
      ></textarea>

      <label for="preferred_contact_method">How should we contact you? *</label>
      <select
        id="preferred_contact_method"
        name="preferred_contact_method"
        required
        >
        <option value="">Select a contact method</option>
        <option value="Email">Email</option>
        <option value="Phone call">Phone call</option>
        <option value="WhatsApp">WhatsApp</option>
      </select>
      
      <label class="consent">
        <input id="consent" name="consent" type="checkbox" required />
        I agree to be contacted about my inquiry.
      </label>

      <button id="submitButton" type="submit">
        Submit inquiry
      </button>
      
      <p id="message" role="status"></p>
    </form>
  </main>
  <script>
    const SUPABASE_URL = "https://drilkkslcvfbwhhgkfbo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Hkm47akggqbaBdOkukx1-Q_Csj0rrKQ";

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("leadForm");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");

  if (!form || !button || !message) {
    console.error(
      "Missing HTML element. Check leadForm, submitButton, and message IDs."
    );
    return;
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "Submitting...";
    message.textContent = "";
    message.className = "";

    const formData = new FormData(form);

    const getText = (name) =>
      String(formData.get(name) || "").trim();

    const lead = {
      full_name: getText("full_name"),
      email: getText("email"),
      phone: getText("phone"),
      company_name: getText("company_name"),
      service_interest: getText("service_interest"),
      estimated_budget: getText("estimated_budget"),
      start_timeline: getText("start_timeline"),
      inquiry_message: getText("inquiry_message"),
      preferred_contact_method: getText("preferred_contact_method"),
      status: "new",
      email_sent: false
    };

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/leads`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Prefer": "return=representation"
        },
        body: JSON.stringify(lead)
      });

      const result = await response.text();

      console.log("Supabase status:", response.status);
      console.log("Supabase response:", result);

      if (!response.ok) {
        throw new Error(result || "Supabase rejected the submission.");
      }

      form.reset();
      showMessage(
        "Thank you. Your inquiry was submitted successfully.",
        "success"
      );
    } catch (error) {
      console.error("Submission error:", error);

      showMessage(
        `Submission failed: ${error.message}`,
        "error"
      );
    } finally {
      button.disabled = false;
      button.textContent = "Submit inquiry";
    }
  });
});
  </script>

</body>
</html>
