<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Inquiry Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <form id="leadForm">
      <h1>Customer Inquiry Form</h1>
      <p class="intro">Tell us how we can help your business.</p>

      <label for="full_name">Full name *</label>
      <input id="full_name" name="full_name" type="text" required />

      <label for="email">Business email address *</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone number *</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="company_name">Company / business name *</label>
      <input id="company_name" name="company_name" type="text" required />

      <label for="service_interest">Which service are you interested in? *</label>
      <select id="service_interest" name="service_interest" required>
        <option value="">Select a service</option>
        <option value="AI automation">AI automation</option>
        <option value="Website development">Website development</option>
        <option value="CRM automation">CRM automation</option>
        <option value="Chatbot">Chatbot</option>
        <option value="Other">Other</option>
      </select>

      <label for="estimated_budget">Estimated budget *</label>
      <select id="estimated_budget" name="estimated_budget" required>
        <option value="">Select your budget</option>
        <option value="Below ₦100,000">Below ₦100,000</option>
        <option value="₦100,000 – ₦300,000">₦100,000 – ₦300,000</option>
        <option value="₦300,000 – ₦1,000,000">₦300,000 – ₦1,000,000</option>
        <option value="Above ₦1,000,000">Above ₦1,000,000</option>
        <option value="I am not sure yet">I am not sure yet</option>
      </select>

      <label for="start_timeline">When would you like to start? *</label>
      <select id="start_timeline" name="start_timeline" required>
        <option value="">Select a timeline</option>
        <option value="Immediately">Immediately</option>
        <option value="Within 1 week">Within 1 week</option>
        <option value="Within 1 month">Within 1 month</option>
        <option value="Later">Later</option>
      </select>
      
      <label for="inquiry_message">Tell us what you need help with *</label>
      <textarea
        id="inquiry_message"
        name="inquiry_message"
        rows="6"
        required
      ></textarea>

      <label for="preferred_contact_method">How should we contact you? *</label>
      <select
        id="preferred_contact_method"
        name="preferred_contact_method"
        required
        >
        <option value="">Select a contact method</option>
        <option value="Email">Email</option>
        <option value="Phone call">Phone call</option>
        <option value="WhatsApp">WhatsApp</option>
      </select>
      
      <label class="consent">
        <input id="consent" name="consent" type="checkbox" required />
        I agree to be contacted about my inquiry.
      </label>

      <button id="submitButton" type="submit">
        Submit inquiry
      </button>
      
      <p id="message" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>

</body>
</html>
